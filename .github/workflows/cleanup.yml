name: Clean up old releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all releases and tags except the newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          keep=$(gh api repos/$REPO/releases/latest --jq .tag_name)
          echo "Keeping $keep"
          for id in $(gh api "repos/$REPO/releases?per_page=100" --paginate --jq ".[] | select(.tag_name != \"$keep\") | .id"); do
            gh api -X DELETE repos/$REPO/releases/$id && echo "Deleted release $id"
          done
          for tag in $(gh api "repos/$REPO/tags?per_page=100" --paginate --jq '.[].name'); do
            if [ "$tag" != "$keep" ]; then gh api -X DELETE repos/$REPO/git/refs/tags/$tag && echo "Deleted tag $tag"; fi
          done
          echo "Left: $(gh api repos/$REPO/releases --jq 'map(.tag_name)|join(",")')"
